services:
  - type: web
    name: echo-assist-go
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: AWS_REGION
        value: ap-south-1
      - key: APP_TIMEZONE
        value: Asia/Kolkata
      - key: DATABASE_URL
        sync: false
      - key: BEDROCK_MODEL_ID
        sync: false
