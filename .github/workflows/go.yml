name: Go checks

on:
  push:
    branches: [main, feature/golang-backend]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: false
      - name: Format Go source
        run: gofmt -w main.go main_test.go
      - name: Resolve and verify modules
        run: go mod tidy
      - name: Test
        run: go test ./...
      - name: Build
        run: go build ./...
